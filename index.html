<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#171916">
    <meta name="description" content="OneLine AI — one question, one clear answer.">

    <title>OneLine AI — Clear answers</title>
    <link rel="icon" type="image/svg+xml" href="gemini-svg (1).svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-shell">

        <aside class="sidebar" id="sidebar">

            <a href="#" class="brand" id="brand-link">
                <span class="brand-mark">/</span>
                <span>OneLine<span class="brand-ai"> AI</span></span>
            </a>

            <button class="new-chat-button" id="new-chat-button">
                <span class="plus-icon">+</span>
                <span>New conversation</span>
                <span class="shortcut">N</span>
            </button>

            <div class="sidebar-section">
                <p class="section-label">YOUR WORKSPACE</p>
                <p class="sidebar-caption">Recent conversations</p>
                <nav id="chat-history" class="chat-history" aria-label="Recent conversations">
                    <!-- Recent conversations appear here. -->
                </nav>
            </div>

            <div class="sidebar-bottom">
                <div class="model-info">
                    <span class="status-dot"></span>
                    <div>
                        <p class="model-name">Groq API</p>
                        <p class="model-description">GPT-OSS 20B</p>
                    </div>
                </div>
                <p class="sidebar-note">ONE QUESTION. ONE CLEAR ANSWER.</p>
            </div>

        </aside>

        <main class="main-panel">

            <header class="topbar">
                <button class="icon-button menu-button" id="menu-button" aria-label="Toggle sidebar"
                    aria-expanded="true">
                    ☰
                </button>

                <div class="breadcrumb">
                    <span>WORKSPACE</span>
                    <span class="breadcrumb-divider">/</span>
                    <span id="current-chat-label">NEW CONVERSATION</span>
                </div>

                <div class="topbar-right">
                    <span class="model-tag">ONE SENTENCE MODE</span>
                </div>
            </header>

            <section class="conversation" id="conversation" aria-label="Chat messages">

                <div class="welcome-screen" id="welcome-screen">
                    <p class="eyebrow">
                        <span class="eyebrow-line"></span>
                        LESS, BUT BETTER
                    </p>

                    <h1>
                        One question.<br>
                        <span>One clear answer.</span>
                    </h1>

                    <p class="welcome-description">
                        No unnecessary paragraphs. Just the point.
                    </p>

                    <div class="suggestions">
                        <button class="suggestion" data-prompt="Explain APIs in simple terms">
                            <span class="suggestion-number">01</span>
                            <span>Explain APIs simply</span>
                            <span class="suggestion-arrow">↗</span>
                        </button>

                        <button class="suggestion" data-prompt="What is cloud computing?">
                            <span class="suggestion-number">02</span>
                            <span>What is cloud computing?</span>
                            <span class="suggestion-arrow">↗</span>
                        </button>

                        <button class="suggestion" data-prompt="Give me one practical Python project idea">
                            <span class="suggestion-number">03</span>
                            <span>Find a Python project idea</span>
                            <span class="suggestion-arrow">↗</span>
                        </button>
                    </div>
                </div>

                <div id="messages" class="messages" aria-live="polite"></div>

            </section>

            <footer class="composer-area">
                <form id="chat-form" class="chat-form">
                    <textarea id="user-input" placeholder="Ask a question..." rows="1" aria-label="Your message"
                        required></textarea>

                    <button type="submit" id="send-button" aria-label="Send message">
                        <span>↑</span>
                    </button>
                </form>

                <div class="composer-meta">
                    <span>SHORT QUESTIONS WORK GREAT</span>
                    <span id="character-count">0 characters</span>
                </div>
            </footer>

        </main>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="script.js?v=5"></script>
</body>

</html>
